[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebius-poc"
version = "0.1.0"
description = "Cluster qualification, multi-node LoRA fine-tuning, and vLLM inference benchmarking for a Nebius Slurm PoC"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
