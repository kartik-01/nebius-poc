[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebius-poc"
version = "0.1.0"
description = "Cluster qualification, multi-node LoRA fine-tuning, and vLLM inference benchmarking for a Nebius Slurm PoC"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.34",
    "datasets>=2.19",
    "numpy>=1.26",
    "peft>=0.13",
    "pyyaml>=6.0",
    "torch>=2.4",
    # 4.56 is the first release that accepts `dtype=` on from_pretrained.
    "transformers>=4.56",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["nebius_poc*", "validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "validator"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
