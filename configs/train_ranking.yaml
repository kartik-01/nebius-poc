objective: candidate_ranking

model:
  id: Qwen/Qwen2.5-7B
  # Pinned; the resolved sha is recorded in the prefetch asset_manifest.json.
  revision: d149729398750b98c0af14eb82c78cfe92750796
  dtype: bfloat16

dataset:
  id: cais/mmlu
  config: professional_law
  adaptation_split: validation
  final_test_split: test
  revision: c30699e8356da336a370243923dbaf21066bb9fe
  pilot_train_size: 150
  pilot_validation_size: 20
  seed: 42
  max_variants_per_question: 4

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 1.0e-4
  epochs: 5
  # This objective forwards all four candidates per question, so a micro-batch of 8
  # questions puts 32 sequences on the GPU and OOMs at 140 GiB. Two questions gives
  # the same 8 sequences in flight as train_sft.yaml, and accumulating four of them
  # restores the identical effective batch of 8 questions per optimizer step, so the
  # objective comparison stays controlled.
  per_device_batch_size: 2
  gradient_accumulation_steps: 4
  max_length: 1024
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  checkpoint_retention: 2
  tf32: true
  seed: 42
