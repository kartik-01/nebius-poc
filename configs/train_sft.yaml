objective: completion_sft

model:
  id: Qwen/Qwen2.5-7B
  # Pinned; the resolved sha is recorded in the prefetch asset_manifest.json.
  revision: d149729398750b98c0af14eb82c78cfe92750796
  dtype: bfloat16

dataset:
  id: cais/mmlu
  config: professional_law
  adaptation_split: validation
  # MMLU ships 5 dev / 170 validation / 1534 test for this category. Training only on
  # the 170-question validation split leaves too little signal to adapt anything, so
  # the category's own records are split here instead: 70% joins the adaptation pool,
  # 30% is reserved by stable question id as the evaluation holdout. Nothing that is
  # evaluated is ever trained on, and the split manifest records both id lists.
  trainable_split: test
  holdout_fraction: 0.3
  revision: c30699e8356da336a370243923dbaf21066bb9fe
  pilot_validation_size: 100
  seed: 42
  max_variants_per_question: 4

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 1.0e-4
  epochs: 5
  per_device_batch_size: 8
  gradient_accumulation_steps: 1
  max_length: 1024
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  checkpoint_retention: 2
  tf32: true
  seed: 42
